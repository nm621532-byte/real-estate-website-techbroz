<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apna Ghar Properties</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">🏠 Apna<span>Ghar</span></div>
    <nav class="nav" id="nav">
      <a href="#home">Home</a>
      <a href="#properties">Properties</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="actions">
      <button id="favBtn">❤️ <span id="favCount">0</span></button>
      <button id="themeBtn">🌙</button>
      <button id="menuBtn" class="menu-btn">☰</button>
    </div>
  </header>

  <section class="hero" id="home">
    <p class="tag">✅ 100% Verified Properties</p>
    <h1>Apna <span>Dream Home</span> Dhundo</h1>
    <p>Flat, villa ya plot: sahi daam, verified owners.</p>
    <div class="search-box">
      <input id="search" placeholder="City ya property ka naam likho...">
      <a href="#properties" class="btn">Search</a>
    </div>
  </section>

  <section id="properties">
    <h2 class="title">Latest Properties</h2>
    <div class="filters">
      <button class="active" data-type="all">All</button>
      <button data-type="Flat">Flat</button>
      <button data-type="Villa">Villa</button>
      <button data-type="Plot">Plot</button>
      <select id="sort">
        <option value="">Sort: Default</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
      </select>
    </div>
    <div class="grid" id="list"></div>
    <p id="empty">Koi property nahi mili 😕</p>
  </section>

  <section id="contact">
    <h2 class="title">Site Visit Book Karo</h2>
    <form id="form">
      <input id="name" placeholder="Aapka naam">
      <input id="phone" placeholder="Mobile number (10 digit)">
      <textarea id="msg" placeholder="Kaunsi property pasand aayi?"></textarea>
      <button class="btn">Send Enquiry</button>
      <p id="error"></p>
    </form>
  </section>

  <footer>© 2026 Apna Ghar Properties • Made by Tech Bro Z</footer>
  <script src="script.js"></script>
</body>
</html>
